version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: fkas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fkas_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    networks:
      - fkas-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fkas_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local

networks:
  fkas-network:
    driver: bridge
